spring.application.name=codequest-api

# Variaveis locais (fora do git): back_codequest-api/.env
spring.config.import=optional:file:.env[.properties]

# Firebase
# ID do projeto no Firebase Console (Configuracoes do projeto > Geral)
firebase.project-id=${FIREBASE_PROJECT_ID:}
# Caminho do JSON da service account. Vazio = usa GOOGLE_APPLICATION_CREDENTIALS / credenciais padrao.
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
# Chave de API Web (Configuracoes do projeto > Geral > Chave de API da Web), usada no login por email/senha.
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}
# Opcional: host:porta do emulador do Firebase Auth (ex.: localhost:9099). O Firestore usa FIRESTORE_EMULATOR_HOST.
firebase.auth-emulator-host=${FIREBASE_AUTH_EMULATOR_HOST:}

# Cria trilhas/licoes de exemplo quando a colecao "trilhas" estiver vazia
codequest.seed.enabled=${CODEQUEST_SEED_ENABLED:true}
